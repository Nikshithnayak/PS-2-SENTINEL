[project]
name = "sentinel-engine"
version = "0.1.0"
description = "Deterministic physiological baseline, three-layer anomaly detection, and simulation engine for SENTINEL"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.1",
    "river==0.27.0",
    "ruptures==1.1.10",
    "neurokit2==0.3.0",
    "psycopg[binary]==3.3.9",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.17",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
